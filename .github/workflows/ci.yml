# Every push and pull request: the upstream copy is unedited, the generated overlays are current,
# and scripts/verify.sh passes: both builds (target/a2ui-kmp, then target/material3-a2ui-kmp) run the upstream tests on
# desktop and publish to build/repo, check-requirements.py checks the versions the artifacts require,
# and tests/integration uses them on desktop, Android host and iOS simulator, once at the verified
# version baseline without material3 ("minimum") and once with every package ("all"). The Android device tests run
# both integration passes against those published artifacts on an emulator (Linux, which has KVM).
# verify.sh ends with the samples, built from the same artifacts on desktop and the iOS simulator.
# release.yml runs this workflow on the tagged commit before it uploads anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Desktop, Android host, iOS simulator, samples
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Upstream copy matches UPSTREAM
        run: python3 scripts/check-upstream.py

      - name: Generated overlays are committed and current
        run: |
          python3 scripts/generate-overlays.py
          changes="$(git status --porcelain -- target tests/integration/src)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Run scripts/generate-overlays.py and commit the result."
            exit 1
          fi

      - name: Build, test, publish locally, test the published artifacts
        run: scripts/verify.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-repo
          path: build/repo
          retention-days: 3

  android-device:
    name: Android device (emulator)
    needs: verify
    # Has the android-37.1 platform tests/integration compiles against.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The artifacts the verify job built and tested, so this job tests exactly those.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-repo
          path: build/repo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator API level
        id: version
        run: |
          echo "api=$(sed -n 's/^androidTestDeviceApi = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.version.outputs.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew --quiet -p tests/integration -Pa2uiIntegration=minimum connectedAndroidDeviceTest
            ./gradlew --quiet -p tests/integration -Pa2uiIntegration=all connectedAndroidDeviceTest
