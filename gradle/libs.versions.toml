# Every version this repository builds and tests with: target/a2ui-kmp, target/material3-a2ui-kmp,
# target/build-logic and tests/integration. (The samples are separate projects with their own catalogs.)
#
# What our artifacts require is what their consumers end up with (README, "Requirements";
# scripts/check-requirements.py), so the five packages of target/a2ui-kmp use a verified baseline of
# stable versions: they compile and pass upstream's tests with these (earlier versions were not tried).
# material3-a2ui needs newer ones: upstream uses Material 3 APIs (MaterialTheme.motionScheme, the new
# Slider and ExposedDropdownMenu, TimePickerState.isInputValid, nonInteractiveScrollbar, the hintText
# semantics) that Compose Multiplatform has only from 1.13, whose klibs need Kotlin 2.4. Raise those to
# the stable 1.13 when it is out.
[versions]
# This release: our artifacts are ai.littlepress.a2ui:<package>:<a2uiKmp>, built from the AndroidX
# A2UI release <a2uiUpstream> in source/ (source/UPSTREAM); on Android they resolve to the official
# androidx.a2ui artifacts of that version. scripts/sync-upstream.py sets both.
a2uiKmp = "1.0.0-alpha02"
a2uiUpstream = "1.0.0-alpha02"
# Kotlin: the line Compose Multiplatform is built with. The common metadata and the JVM class files are
# Kotlin 2.2 (languageVersion / apiVersion, as upstream androidx.a2ui 1.0.0-alpha02); on iOS, what a
# consumer needs is the klib ABI version, 2.3 for target/a2ui-kmp and 2.4 for target/material3-a2ui-kmp.
kotlin = "2.3.21"
kotlinMaterial3 = "2.4.0"
# Google's Compose runtime is multiplatform. Upstream builds with 1.13.0-alpha03; the five packages
# need nothing newer than the stable 1.12 line. On Android our artifacts resolve to the official
# ones, which require 1.13.0-alpha03 there.
composeRuntime = "1.12.1"
composeRuntimeMaterial3 = "1.13.0-alpha03"
# Google's Compose UI has no iOS build; JetBrains Compose Multiplatform does (on Android it is Google's).
composeMultiplatform = "1.12.2"
composeMultiplatformMaterial3 = "1.13.0-beta01"
# Same versions as upstream androidx.a2ui 1.0.0-alpha02 (a2ui/*/build.gradle at e0a272dc).
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
androidxCollection = "1.6.0"
androidxAnnotation = "1.10.0"
truth = "1.4.4"
junit = "4.13.2"
guava = "33.4.8-jre"
mockito = "5.18.0"
mockitoKotlin = "5.4.0"
gson = "2.13.1"
testParameterInjector = "1.22"
# Maven Central publishing (sources, javadoc and signing for every KMP publication).
mavenPublish = "0.37.0"
# tests/integration: an Android app's build. The official 1.0.0-alpha02 artifacts require compileSdk
# 37.1 (compose-runtime; a2ui-model needs 37 through androidx.core 1.19.0).
androidGradlePlugin = "9.2.1"
androidCompileSdk = "37"
androidCompileSdkMinor = "1"
androidMinSdk = "26"
# The Android version tests/integration's device tests run on (CI's emulator; verify.sh uses whatever
# device is connected): Android 15, the version the recorded Android results come from.
androidTestDeviceApi = "35"
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"

[libraries]
# target/build-logic compiles against these (compileOnly); each build applies its own versions (plugins).
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

# target/a2ui-kmp
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntime" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
# Compose UI tests on desktop (upstream's instrumented tests), with the Skia runtime for the host.
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

# target/material3-a2ui-kmp
material3-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntimeMaterial3" }
material3-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatformMaterial3" }
material3-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatformMaterial3" }
material3-compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatformMaterial3" }
# On Android this is Google's material3 1.5.0-beta01; upstream material3-a2ui uses 1.5.0-alpha28.
material3-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
material3-compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatformMaterial3" }

# Both builds and tests/integration
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidxCollection" }
test-parameter-injector = { module = "com.google.testparameterinjector:test-parameter-injector", version.ref = "testParameterInjector" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
junit = { module = "junit:junit", version.ref = "junit" }
guava-testlib = { module = "com.google.guava:guava-testlib", version.ref = "guava" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
# target/a2ui-kmp
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# target/material3-a2ui-kmp
kotlinMaterial3-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinMaterial3" }
kotlinMaterial3-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinMaterial3" }
# Both
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
